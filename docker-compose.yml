# ArmoryHub self-hosted stack.
#
#   cp env.example .env   # then fill in the secrets
#   docker compose up -d
#
# ---------------------------------------------------------------------------
# You need HTTPS. Pick one of these three.
# ---------------------------------------------------------------------------
#
# This is not optional: browsers only allow the encryption ArmoryHub depends on
# over HTTPS or on localhost. Reach your instance by IP over plain http:// and you
# will be able to sign in and then fail to unlock your data.
#
# 1. TAILSCALE SIDECAR — recommended. Start it with:
#
#      docker compose --profile tailscale up -d
#
#    It prints a link. Open it, sign in, approve the machine, and your instance is
#    live at https://armoryhub.<your-tailnet>.ts.net with a real certificate that
#    renews itself — no port forwarding, no DNS record, no firewall changes. Your
#    server keeps its own tailnet name for whatever else it runs.
#
#    Once it is up, set APP_URL in your env file to that https:// address. If you
#    installed through CasaOS, Portainer or similar, update the app's Web UI
#    address there too — those dashboards cannot detect it for you.
#
# 2. TAILSCALE ON THE HOST — if you already run Tailscale on this machine and do
#    not mind ArmoryHub taking over its hostname:
#
#      tailscale serve --bg http://localhost:8477
#
#    Use the port you set in APP_PORT, and re-run the command if you change it.
#    This claims the whole HTTPS root of the machine's tailnet name, so anything
#    else you serve from this box stops being reachable under that name.
#
# 3. CADDY — only if you want a PUBLIC address on a domain you own:
#
#      docker compose --profile caddy up -d
#
#    This one needs a DNS A record and ports 80 and 443 reachable from the
#    internet, and it puts your instance on the public internet, which is the
#    opposite of what options 1 and 2 give you. Be aware that many residential
#    ISPs block port 80; when they do, certificate issuance fails in a way that
#    looks like a Caddy problem. Edit docker/selfhost/caddy/Caddyfile to change
#    anything beyond the hostname.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: armoryhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD}
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"
      # Runs once, on an empty data directory: creates the migrator/app roles,
      # uuid-ossp, and the supabase_realtime publication stub.
    configs:
      - source: initdb_roles
        target: /docker-entrypoint-initdb.d/01_roles.sh
        mode: 0755
    # There is no `ports:` here on purpose. The app reaches the database over
    # Docker's internal network, so nothing needs to be published.
    #
    # Do not add one. Publishing 5432 to your network — or to the internet — is
    # the most damaging change you could make to this file.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d armoryhub"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    # Set ARMORYHUB_VERSION in your env file to pin a version, e.g. 0.1.1.
    # `latest` works, but then you cannot tell which version you are running or
    # go back to a previous one.
    image: ghcr.io/marcjwrigg/armoryhub-selfhost:${ARMORYHUB_VERSION:-0.1.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEPLOYMENT_MODE: selfhosted
      ANALYTICS_ENABLED: "false"

      # Two separate database logins. The first applies schema changes on start;
      # the second is what the running app uses, and it deliberately does not own
      # the tables, which is what keeps its access rules enforced.
      #
      # Do not point both at the same user.
      DATABASE_ADMIN_URL: postgres://armoryhub_migrator:${MIGRATOR_DB_PASSWORD}@db:5432/armoryhub
      DATABASE_URL: postgres://armoryhub_app:${APP_DB_PASSWORD}@db:5432/armoryhub

      # Set this to your HTTPS address once you have one. The fallback matches the
      # default APP_PORT and only works from the server itself.
      APP_URL: ${APP_URL:-http://localhost:8477}

      # Signs the session cookie. The entrypoint refuses to boot without it —
      # a missing or weak value would mean anyone could mint a session for any
      # user id.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET (openssl rand -base64 48)}

      # Allows a non-Secure session cookie so plain http://localhost works for
      # local testing. Must stay unset in real use, where Caddy or
      # `tailscale serve` terminates TLS.
      ALLOW_INSECURE_COOKIES: ${ALLOW_INSECURE_COOKIES:-false}

      STORAGE_DRIVER: fs
      STORAGE_PATH: /data/files
      REALTIME_MODE: poll
      REALTIME_POLL_MS: "30000"
      LICENSE_FILE: /data/license.jwt
      ENCRYPTION_AUTO_UNLOCK: "false"
      BACKUP_DIR: /data/backups
    volumes:
      - "./data/app:/data"
    ports:
      # This port is reachable only from the server itself, not from the rest of
      # your network. That is intentional: anyone who joins your wifi would
      # otherwise reach an unencrypted login form.
      #
      # Reach your instance over HTTPS instead — see the three options at the top
      # of this file.
      #
      # Setting APP_BIND=0.0.0.0 opens it to your whole network in plain HTTP.
      # Only do that if you are putting your own HTTPS proxy in front of it.
      #
      # Change APP_PORT if 8477 clashes with something else you run. The 3000 on
      # the right is inside the container and never collides with anything.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8477}:3000"

  # Gives ArmoryHub its own address on your private network, with real HTTPS.
  #
  #   docker compose --profile tailscale up -d
  #
  # It prints a link; open it and approve the machine. You end up with
  # https://armoryhub.<your-tailnet>.ts.net, and this server keeps its own name for
  # CasaOS and anything else it runs.
  #
  # You do not need Tailscale installed on the server, and you do not need an auth
  # key unless nobody is around to click the link.
  #
  # Keep ./data/tailscale. That is where this machine's identity is stored — delete
  # it and your instance comes back as a different machine, at a different address.
  #
  # Keep COMPOSE_PROFILES=tailscale in your env file too. This is an optional service,
  # so it starts only when Compose is told to include it; once it has stopped, a plain
  # `docker compose up -d` leaves it down and your HTTPS address stops resolving —
  # which in a browser looks like a blank page rather than an error.
  #
  # `docker compose ps` should always list four services: app, db, backup, tailscale.
  tailscale:
    profiles: ["tailscale"]
    image: tailscale/tailscale:stable
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Optional. Leave it empty and you approve the machine by clicking a link
      # instead, which is the easier path. Only worth setting for an unattended
      # install, and then it must be a reusable, non-ephemeral key.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-armoryhub}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - "./data/tailscale:/var/lib/tailscale"
    configs:
      - source: tailscale_serve
        target: /config/serve.json

  # Backs up your database and files every night, automatically. Nothing to set up
  # and nothing to remember.
  #
  # Backups are written to ./data/backups as ordinary files. Copy them somewhere
  # else periodically — a backup on the same disk as the original does not survive
  # that disk failing. The contents are already encrypted, so cloud storage is fine.
  backup:
    image: ghcr.io/marcjwrigg/armoryhub-selfhost:${ARMORYHUB_VERSION:-0.1.5}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgres://armoryhub_migrator:${MIGRATOR_DB_PASSWORD}@db:5432/armoryhub
      BACKUP_DIR: /backups
      FILES_DIR: /data/files
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      # Read-only, so the nightly backup cannot alter your live data.
      - "./data/app:/data:ro"
      - "./data/backups:/backups"
    entrypoint: ["/bin/sh", "/app/backup.sh", "loop"]

  # Backup tools. These only run when you ask for them:
  #
  #   docker compose --profile tools run --rm restore list             # what you have
  #   docker compose --profile tools run --rm restore verify latest    # check one
  #   docker compose --profile tools run --rm restore once             # back up now
  #   docker compose --profile tools run --rm restore restore <stamp>  # put one back
  #
  # Verify a backup before you need it. An untested backup is not a backup.
  #
  # Stop the app before restoring, and start it afterwards:
  #
  #   docker compose stop app
  #   docker compose --profile tools run --rm restore restore <stamp>
  #   docker compose start app
  restore:
    profiles: ["tools"]
    image: ghcr.io/marcjwrigg/armoryhub-selfhost:${ARMORYHUB_VERSION:-0.1.5}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_ADMIN_URL: postgres://armoryhub_migrator:${MIGRATOR_DB_PASSWORD}@db:5432/armoryhub
      BACKUP_DIR: /backups
      FILES_DIR: /data/files
    volumes:
      - "./data/app:/data"
      - "./data/backups:/backups"
    entrypoint: ["/bin/sh", "/app/backup.sh"]

  # Automatic HTTPS on a domain you own. Only starts if you ask for it:
  #
  #   docker compose --profile caddy up -d
  #
  # Set CADDY_SITE_ADDRESS and CADDY_ACME_EMAIL in your env file first. Remember
  # this makes your instance reachable from the public internet.
  #
  # If you also run Tailscale, the two will fight over port 443 — pick different
  # ports for one of them.
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-armoryhub.localhost}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@localhost}
    volumes:
      # Your certificates. Keep this — deleting it forces new ones to be issued,
      # and there are limits on how often you can do that.
      - "./data/caddy:/data"
      - "./data/caddy-config:/config"
    # If you use a non-standard port, put it in CADDY_SITE_ADDRESS as well, e.g.
    # armory.example.com:8443, and set CADDY_HTTPS_PORT to the same number.
    #
    # If you set only one of the two, connections fail while the logs show
    # certificates being issued perfectly happily — which looks like a certificate
    # problem and is not one.
    ports:
      - "${CADDY_HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}"
      - "${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}"
      - "${CADDY_HTTPS_PORT:-443}:${CADDY_HTTPS_PORT:-443}/udp"

# ---------------------------------------------------------------------------
# Setup scripts, embedded so this one file is a complete deployment.
#
# Nothing below needs changing for a normal install. It is here rather than in
# separate files so you can paste this single file into CasaOS, Portainer or Dockge,
# or run `docker compose up -d` in an empty directory, and have it work.
#
# ⚠️ If you edit anything below, keep every `$$` doubled.
#
# Docker Compose substitutes variables throughout this file — including inside
# comments — before the containers ever see it. A single dollar sign is treated as
# the start of a variable name and replaced with nothing.
#
# So a name written with one dollar sign instead of two leaves the database setup
# running with an empty username, and the failure surfaces much later as
# "permission denied for database armoryhub", a long way from the typo that caused
# it. It also makes Compose print "variable is not set" warnings on every command.
# ---------------------------------------------------------------------------
configs:
  initdb_roles:
    content: |
      #!/bin/bash
      # Runs once, when the database is first created. It does not run again.
      #
      # Creates the two database users the stack needs:
      #
      #   armoryhub_migrator  owns the tables and applies schema changes
      #   armoryhub_app       what the running app uses — does NOT own the tables
      #
      # That split is what keeps the app's access rules enforced. If the app ever
      # connects as the owning user, those rules stop applying.
      set -euo pipefail

      : "$${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}"
      : "$${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD must be set}"

      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
          CREATE ROLE armoryhub_migrator LOGIN PASSWORD '$${MIGRATOR_DB_PASSWORD}';
          CREATE ROLE armoryhub_app      LOGIN PASSWORD '$${APP_DB_PASSWORD}';

          GRANT USAGE, CREATE ON SCHEMA public TO armoryhub_migrator;
          GRANT USAGE         ON SCHEMA public TO armoryhub_app;

          -- Required for CREATE SCHEMA auth / storage in the bootstrap step.
          -- The app role deliberately never gets this.
          GRANT CREATE ON DATABASE "$${POSTGRES_DB}" TO armoryhub_migrator;

          -- Lets the backup read every row. Without this, backups fail outright
          -- rather than quietly saving an incomplete copy.
          --
          -- This applies only to the user that owns the tables and runs backups.
          -- The app's own user does not get it, and the app refuses to start if it
          -- ever does.
          ALTER ROLE armoryhub_migrator BYPASSRLS;

          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

          -- Your instance checks for updates by polling, so nothing subscribes to
          -- this. It exists so the standard schema applies without modification.
          --
          -- You will see a "wal_level is insufficient" warning in the logs on first
          -- start. That is expected and harmless — ignore it. Turning on logical
          -- replication to silence it only costs you disk.
          CREATE PUBLICATION supabase_realtime;
          ALTER PUBLICATION supabase_realtime OWNER TO armoryhub_migrator;
      EOSQL

      echo "[initdb] roles armoryhub_migrator / armoryhub_app created"

  tailscale_serve:
    content: |
      {
        "//": [
          "Tailscale settings for ArmoryHub. You do not need to edit this.",
          "",
          "Your instance gets its own address, armoryhub.<your-tailnet>.ts.net, and",
          "this server keeps its own name for CasaOS and anything else it runs.",
          "",
          "The address below is filled in automatically when the container starts.",
          "",
          "Traffic reaches the app over Docker's internal network, so nothing has to",
          "be published on the server itself. If you want nothing at all bound on",
          "the server, you can delete the app service's ports: block above."
        ],
        "TCP": {
          "443": {
            "HTTPS": true
          }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": {
                "Proxy": "http://app:3000"
              }
            }
          }
        }
      }

  caddyfile:
    content: |
      # Only used if you run the caddy profile, for a public address on your own
      # domain. If you are using Tailscale, ignore this file entirely.
      #
      # This file is yours to change — hostname, extra routes, passwords, whatever
      # you need. It is minimal on purpose.
      #
      # Two settings, both from your env file:
      #   CADDY_SITE_ADDRESS  the hostname to serve, e.g. armory.example.com
      #   CADDY_ACME_EMAIL    where certificate expiry notices go
      #
      # To test locally, set CADDY_SITE_ADDRESS to anything ending in .localhost and
      # Caddy will issue its own certificate without contacting anyone.
      #
      # Do not add security headers here. The app already sends them, and browsers
      # combine rather than replace them — two sets means both must be satisfied,
      # which breaks pages in ways that look like a fault in ArmoryHub.
      #
      # ⚠️ If you use a port other than 80/443, include it in CADDY_SITE_ADDRESS,
      # e.g. armory.example.com:8443. Otherwise visitors get redirected to your
      # domain without the port, which does not resolve.

      {
      	# Set CADDY_ACME_EMAIL to a real address before going live.
      	email {$$CADDY_ACME_EMAIL:admin@localhost}

      	# Uncomment this line while you are still getting a real domain working.
      	# It uses a test service with much higher limits, so mistakes cost nothing.
      	# Browsers will warn about the certificate until you comment it out again.
      	# acme_ca https://acme-staging-v02.api.letsencrypt.org/directory
      }

      {$$CADDY_SITE_ADDRESS:armoryhub.localhost} {
      	reverse_proxy app:3000

      	encode zstd gzip

      	# Upload limit, matching the app's own 100 MB document limit. Lower it if
      	# you want, but photos and documents will be rejected above whatever you set.
      	request_body {
      		max_size 100MB
      	}

      	log {
      		output stderr
      		format console
      		# Errors only. Full access logs would record every page you visit, which
      		# is not something a private instance needs to keep. Change to INFO if you
      		# are diagnosing something.
      		level ERROR
      	}
      }

# ---------------------------------------------------------------------------
# Where your data lives
# ---------------------------------------------------------------------------
#
# Everything is in ./data, next to this file:
#
#   ./data/postgres    your database
#   ./data/app/files   your photos and documents
#   ./data/backups     nightly backups
#
# They are ordinary directories, so you can copy them, back them up, or move them
# to another machine with whatever tools you already use. `docker compose down -v`
# will not delete them.
#
# If you move this file, move ./data with it. And if you create these directories
# yourself instead of using install.sh, they must be owned by uid 1001 — that is
# the user the app runs as, and it cannot write to them otherwise:
#
#   docker run --rm -v /path/to/armoryhub/data:/d alpine \
#     sh -c 'chown -R 1001:1000 /d/app /d/backups && chmod -R 750 /d/app /d/backups'
#
# Substitute your own directory, and your group id in place of 1000 — run `id -g` to
# find it. Group ownership is what lets you read your own backups without sudo.
#
# (Written without shell variables on purpose. Compose expands anything beginning
# with a dollar sign in this file, comments included, so writing one here — even in a
# comment, even inside backticks — makes Compose print an "unset variable" warning on
# every single command, or quietly substitute a value you did not intend.)

# ---------------------------------------------------------------------------
# CasaOS app card
# ---------------------------------------------------------------------------
#
# Used by CasaOS to name and describe the app. Other tools ignore it.
#
# ⚠️ AFTER INSTALLING, SET THE WEB UI ADDRESS YOURSELF.
#
# Open the app's settings in CasaOS and set the Web UI address to your full
# Tailscale address, once you have approved the machine:
#
#   https://armoryhub.<your-tailnet>.ts.net
#
# Until you do, the "open" button will not work. CasaOS cannot fill this in for
# you: ArmoryHub is bound to 127.0.0.1 so it is not reachable from the rest of your
# network, and the Tailscale address does not exist yet when this file is read.
#
# Do not change the other settings from the CasaOS form. It cannot represent
# everything in this file, and saving can rewrite it incorrectly. Edit this file
# directly instead.
# ---------------------------------------------------------------------------
x-casaos:
  architectures:
    - amd64
    - arm64
  main: app
  author: ArmoryHub
  developer: ArmoryHub
  category: Utilities
  title:
    en_us: ArmoryHub
  tagline:
    en_us: Firearm inventory with zero-knowledge encryption
  description:
    en_us: >-
      Firearm inventory, range data, reloading records and NFA tracking. All data is
      encrypted on your device before it is stored, so this server never holds
      anything readable — not even to you without your PIN.

      Reach it over HTTPS via Tailscale. Because the app binds to localhost only,
      the Web UI address below must be set to your Tailscale hostname after you
      approve the machine.
  icon: https://raw.githubusercontent.com/marcjwrigg/armoryhub-selfhost-install/main/icon.png
  scheme: https
  index: /
  port_map: "8477"
  tips:
    before_install:
      en_us: >-
        HTTPS is required. Browsers only permit the encryption ArmoryHub depends on
        over HTTPS or on localhost, so after install you must approve the Tailscale
        machine and use the https://...ts.net address. Reaching it by IP over plain
        http will let you sign in but not unlock your data.
